name: Apps (Android, Windows, iOS)

# Builds the three client apps from clients/*. They load the live website, so they only need a rebuild when the
# native shell itself changes. Push a tag like v1.0.0 to publish a GitHub Release with every download attached.
on:
  push:
    branches: [main]
    paths: ["clients/**", ".github/workflows/clients.yml"]
    tags: ["v*"]
  pull_request:
    paths: ["clients/**", ".github/workflows/clients.yml"]
  workflow_dispatch:

concurrency:
  group: apps-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Release builds always point at the live site. Tags give the version; otherwise 1.0.<run number>.
  VERSION_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v1.0.{0}', github.run_number) }}

jobs:
  android:
    name: Android (APK + AAB)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults: { run: { working-directory: clients/android } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clients/android/package-lock.json
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: 21 }
      - uses: android-actions/setup-android@v4
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v6
      - run: npm ci --no-audit --no-fund
      - name: Prepare signing key (only when the secrets exist)
        id: sign
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/sahaj-release.jks"
            echo "SAHAJ_KEYSTORE=$RUNNER_TEMP/sahaj-release.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else echo "No signing secrets: building an unsigned release (fork or pull request)."; echo "signed=false" >> "$GITHUB_OUTPUT"; fi
      - name: Build release APK and Play Store bundle
        env:
          SAHAJ_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SAHAJ_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SAHAJ_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SAHAJ_VERSION_CODE: ${{ github.run_number }}
        run: |
          export SAHAJ_VERSION_NAME="${VERSION_NAME#v}"
          npm run sync
          (cd android && ./gradlew assembleRelease bundleRelease --no-daemon)
      - name: Verify the APK signature and contents
        if: steps.sign.outputs.signed == 'true'
        run: |
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK" | head -3
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$APK" | grep -E "package:|application-label:|sdkVersion|targetSdkVersion"
          ls -lh "$APK"
      - name: Name the files
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/*.apk "out/Sahaj-${VERSION_NAME#v}.apk"
          cp android/app/build/outputs/bundle/release/*.aab "out/Sahaj-${VERSION_NAME#v}.aab"
      - uses: actions/upload-artifact@v7
        with: { name: android, path: clients/android/out/*, retention-days: 30 }

  windows:
    name: Windows (installer .exe)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults: { run: { working-directory: clients/windows } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clients/windows/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Set the version
        shell: bash
        run: npm pkg set version="${VERSION_NAME#v}"
      - name: Build the installer
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"   # unsigned unless a code-signing certificate is added later
      - name: The installed app starts and stays up
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path dist/win-unpacked -Filter Sahaj.exe | Select-Object -First 1
          if (-not $exe) { throw "Sahaj.exe was not built" }
          $p = Start-Process -FilePath $exe.FullName -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { throw "The app exited early with code $($p.ExitCode)" }
          Write-Host "Sahaj.exe is running (pid $($p.Id))"
          Stop-Process -Id $p.Id -Force
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: |
            clients/windows/dist/Sahaj-Setup-*.exe
            clients/windows/dist/Sahaj-Setup-*.exe.blockmap
            clients/windows/dist/latest.yml
          retention-days: 30

  ios:
    name: iOS (compiles + unsigned .ipa)
    runs-on: macos-latest
    timeout-minutes: 45
    defaults: { run: { working-directory: clients/ios } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clients/ios/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Prepare pages and install native dependencies
        run: |
          npm run sync
          cd ios/App && pod install
      - name: Build for a real iPhone (unsigned) and for the simulator
        run: |
          set -o pipefail
          BUILD="${VERSION_NAME#v}"
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release -sdk iphoneos \
            -derivedDataPath build/device CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            MARKETING_VERSION="$BUILD" CURRENT_PROJECT_VERSION="${{ github.run_number }}" build | tail -25
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Debug -sdk iphonesimulator \
            -derivedDataPath build/sim CODE_SIGNING_ALLOWED=NO build | tail -8
      - name: Package
        run: |
          mkdir -p out/Payload
          cp -R build/device/Build/Products/Release-iphoneos/App.app out/Payload/
          (cd out && zip -qr "Sahaj-${VERSION_NAME#v}-unsigned.ipa" Payload && rm -rf Payload)
          (cd build/sim/Build/Products/Debug-iphonesimulator && zip -qr "$GITHUB_WORKSPACE/clients/ios/out/Sahaj-${VERSION_NAME#v}-simulator.zip" App.app)
          ls -lh out
      - uses: actions/upload-artifact@v7
        with: { name: ios, path: clients/ios/out/*, retention-days: 30 }

  release:
    name: Publish GitHub Release
    needs: [android, windows, ios]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v8
        with: { path: artifacts }
      - name: Create the release with every download attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find artifacts -type f | sort
          gh release create "$VERSION_NAME" --repo "$GITHUB_REPOSITORY" --title "Sahaj ${VERSION_NAME#v}" --generate-notes \
            --notes "Android: install the .apk (allow 'install unknown apps' once). Windows: run Sahaj-Setup. iPhone: the .ipa is unsigned and needs signing (see clients/README.md)." \
            $(find artifacts -type f | sed 's/^/ /') || gh release upload "$VERSION_NAME" --repo "$GITHUB_REPOSITORY" --clobber $(find artifacts -type f)
