# Production stack on the EC2 host. Images come from Docker Hub (built and pushed by CI).
# Secrets live only in /opt/sahaj/.env on the server. Nothing secret is in this file or in the images.
name: sahaj
services:
  api:
    image: ${API_IMAGE:?set API_IMAGE}
    init: true
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "4000"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 420m
    pids_limit: 200
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/api/health | grep -q '\"db\":true'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }
    networks: [internal]

  web:
    image: ${WEB_IMAGE:?set WEB_IMAGE}
    restart: unless-stopped
    depends_on:
      api: { condition: service_healthy }
    ports: ["80:80", "443:443", "443:443/udp"]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 120m
    volumes:
      - caddy_data:/data     # certificates (keep, or Let's Encrypt rate limits bite)
      - caddy_config:/config
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }
    networks: [internal]

networks:
  internal: {}
volumes:
  caddy_data: {}
  caddy_config: {}
